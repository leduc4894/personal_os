# Canonical PostgreSQL baseline Alembic configuration.
#
# This file carries NO connection values of any kind. The migration
# connection is built in memory by migrations/env.py from the frozen
# KNOWLEDGE_* settings and the bounded secret-file contract owned by
# migrations/database_migration_runtime.py.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
transaction_per_migration = true

# Logging stays bounded: no SQL echo, no parameter values, no connection data.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
