name: exclusion policy acceptance

# Cross-surface exclusion-policy publication gate (exclusion-policy-publication
# plan, Task 13): one disposable guarded Compose project (PostgreSQL 18.4 +
# Temporal) carries every gate — the real Alembic migration chain, the feature
# suite (unit/contract/integration through `poe exclusion-policy-test`, marker
# override enabled so the stack suites fail, never skip), the reference
# performance budgets, the Web and plugin vitest suites and the Playwright
# browser journey. The test signing keys are disposable, generated inside the
# job through the application's own secret-file boundary and never echoed;
# only the derived public key id is printed. No GitHub secret feeds this
# workflow, so fork pull requests may run it.
#
# Only redacted JUnit reports (opaque case names and durations) may leave the
# runner, and the exact guarded project is destroyed in an always() cleanup
# with a label-exhaustive leftover assertion.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: exclusion-policy-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exclusion-policy-acceptance:
    name: Exclusion policy acceptance stack
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "true"
      LOCAL_STACK_TEST_PROJECT: knowledge-ci-${{ github.run_id }}-${{ github.run_attempt }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.14.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Setup pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: "10.34.0"
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76336085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install verified Docker Compose v2.30.0
        shell: bash
        run: |
          set -euo pipefail
          download_path="${RUNNER_TEMP}/docker-compose-linux-x86_64"
          curl --fail --location --silent --show-error \
            --output "$download_path" \
            https://github.com/docker/compose/releases/download/v2.30.0/docker-compose-linux-x86_64
          echo "1cddcb3399cc68c385796a6ab441ab5734d4c6a0cb4713bd2bf3f0d384550a38  $download_path" \
            | sha256sum --check --strict
          sudo install -D --mode 0755 \
            "$download_path" /usr/local/lib/docker/cli-plugins/docker-compose
          docker compose version --short | grep -Ex 'v?2\.30\.0'
      - name: Install pinned PostgreSQL 18.4 client tools
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m 755 /usr/share/postgresql-common/pgdg
          sudo curl --fail --location --silent --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq 'postgresql-client-18=18.4*'
          # Debian keeps the binaries outside PATH for non-default majors.
          sudo ln -s /usr/lib/postgresql/18/bin/pg_dump /usr/local/bin/pg_dump
          sudo ln -s /usr/lib/postgresql/18/bin/pg_restore /usr/local/bin/pg_restore
          pg_dump --version | grep -Ex 'pg_dump \(PostgreSQL\) 18\.4.*'
          pg_restore --version | grep -Ex 'pg_restore \(PostgreSQL\) 18\.4.*'
      - name: Validate bounded project identity
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$LOCAL_STACK_TEST_PROJECT" =~ ^knowledge-ci-[0-9]+-[0-9]+$ ]]; then
            exit 1
          fi
          if (( ${#LOCAL_STACK_TEST_PROJECT} > 63 )); then
            exit 1
          fi
      - name: Sync frozen Python workspace
        run: uv sync --all-packages --frozen
      - name: Install frozen npm workspace
        run: pnpm install --frozen-lockfile
      - name: Prefetch pinned stack images
        shell: bash
        run: |
          set -euo pipefail
          docker compose --file infra/compose/compose.yaml \
            --project-name "$LOCAL_STACK_TEST_PROJECT" pull --quiet
      - name: Generate disposable test signing key
        shell: bash
        env:
          POLICY_TEST_SECRET_ROOT: ${{ runner.temp }}/exclusion-policy-signing
        run: |
          set -euo pipefail
          install -d -m 700 "$POLICY_TEST_SECRET_ROOT"
          # The disposable test signing key is generated inside the job through
          # the application's own secret-file boundary (exclusive create,
          # mode 0600, unencrypted PKCS#8 Ed25519). Only the derived public
          # key id is ever printed; the private material never reaches stdout,
          # the environment or any artifact.
          uv run python - <<'PY'
          import os
          from pathlib import Path

          from api_runtime.exclusion_policy_commands import (
              create_or_load_policy_signing_key,
          )
          from personal_os.exclusion_policy.signatures import (
              is_wellformed_ed25519_key_id,
          )

          secret_root = Path(os.environ["POLICY_TEST_SECRET_ROOT"])
          key = create_or_load_policy_signing_key(
              secret_root, "exclusion_policy_ci_signing.pem"
          )
          assert is_wellformed_ed25519_key_id(key.key_id)
          print(f"disposable signing key id: {key.key_id}")
          PY
          test "$(stat -c '%a' "$POLICY_TEST_SECRET_ROOT/exclusion_policy_ci_signing.pem")" = "600"
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Prepare sanitized results directory
        shell: bash
        run: |
          set -euo pipefail
          # The stack bootstrap requires the .local parent directory at mode
          # 0700; a default-umask mkdir -p would create it 0755 and fail the
          # run closed with unsafe_secret_set.
          install -d -m 700 .local
          mkdir -p .local/test-results
      - name: Run migration gate on the disposable stack
        run: uv run pytest tests/integration/exclusion_policy/test_policy_migration.py -m local_stack -q --junitxml=.local/test-results/exclusion-policy-migration.xml
      - name: Run exclusion-policy acceptance feature gate
        env:
          PYTEST_ADDOPTS: --junitxml=.local/test-results/exclusion-policy-feature.xml
        run: uv run --all-packages --frozen poe exclusion-policy-test
      - name: Run performance budget gate
        run: uv run pytest tests/performance/test_exclusion_policy_performance.py -m local_stack -q --junitxml=.local/test-results/exclusion-policy-performance.xml
      - name: Run Web admin vitest gate
        run: pnpm --filter @workspace/web-runtime run test
      - name: Run Obsidian plugin vitest gate
        run: pnpm --filter @workspace/obsidian-plugin run test
      - name: Run exclusion-policy browser journey gate
        run: pnpm run test:e2e:exclusion-policy
      - name: Remove disposable test signing key material
        if: always()
        shell: bash
        env:
          POLICY_TEST_SECRET_ROOT: ${{ runner.temp }}/exclusion-policy-signing
        run: rm -rf -- "$POLICY_TEST_SECRET_ROOT"
      - name: Reset exact project and assert cleanup
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          uv run python tools/local_service_stack.py reset \
            --project-name "$LOCAL_STACK_TEST_PROJECT" \
            --confirm-project "$LOCAL_STACK_TEST_PROJECT" \
            --non-interactive
          reset_status=$?

          project_filter="label=com.docker.compose.project=$LOCAL_STACK_TEST_PROJECT"
          inventory_status=0
          remaining_containers="$(docker container ls -a --filter "$project_filter" --format '{{.ID}}')" \
            || inventory_status=$?
          remaining_networks="$(docker network ls --filter "$project_filter" --format '{{.ID}}')" \
            || inventory_status=$?
          remaining_volumes="$(docker volume ls --filter "$project_filter" --format '{{.Name}}')" \
            || inventory_status=$?
          if (( reset_status != 0 || inventory_status != 0 )); then
            exit 1
          fi
          if [[ -n "$remaining_containers" || -n "$remaining_networks" || -n "$remaining_volumes" ]]; then
            exit 1
          fi
      - name: Upload sanitized JUnit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exclusion-policy-acceptance-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/test-results/exclusion-policy-migration.xml
            .local/test-results/exclusion-policy-feature.xml
            .local/test-results/exclusion-policy-performance.xml
            test-results/playwright-junit.xml
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
