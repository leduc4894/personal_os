# Temporary diagnostic workflow: surfaces raw `docker compose up` output on a
# Linux runner to identify the deterministic stack_startup_failed cause.
# Delete after the root cause is fixed.
name: stack startup diagnosis
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      LOCAL_STACK_TEST_PROJECT: knowledge-ci-diagnosis-1
      UV_PYTHON: 3.14.6
      TEMPORAL_GRPC_PORT: "17243"
      TEMPORAL_UI_PORT: "18083"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Sync frozen Python workspace
        run: uv sync --all-packages --frozen
      - name: Install pinned PostgreSQL 18.4 client tools (hypothesis test)
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m 755 /usr/share/postgresql-common/pgdg
          sudo curl --fail --location --silent --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq 'postgresql-client-18=18.4*'
          sudo ln -s /usr/lib/postgresql/18/bin/pg_dump /usr/local/bin/pg_dump
          sudo ln -s /usr/lib/postgresql/18/bin/pg_restore /usr/local/bin/pg_restore
          pg_dump --version
      - name: Bootstrap stack secrets through the production tool
        run: |
          set -euo pipefail
          install -d -m 700 .local
          uv run python tools/local_service_stack.py bootstrap --project-name "$LOCAL_STACK_TEST_PROJECT"
      - name: Run the production stack up step with acceptance ports
        run: |
          set -uo pipefail
          uv run python tools/local_service_stack.py config --project-name "$LOCAL_STACK_TEST_PROJECT"
          echo "config exit: $?"
          uv run python tools/local_service_stack.py up --project-name "$LOCAL_STACK_TEST_PROJECT"
          up_exit=$?
          echo "tool up exit: $up_exit"
          exit "$up_exit"
      - name: Reproduce the exact acceptance pytest stack fixture
        run: |
          set -uo pipefail
          install -d -m 700 .local
          uv run pytest tests/integration/canonical_core -m "local_stack and r2_live" -q || pytest_status=$?
          echo "pytest exit: ${pytest_status:-0}"
          exit 0
      - name: Cycle the stack repeatedly to reproduce intermittent startup failure
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5 6; do
            echo "=== cycle $attempt: raw compose up ==="
            docker compose --file infra/compose/compose.yaml \
              --project-name "$LOCAL_STACK_TEST_PROJECT" \
              up --detach --remove-orphans --wait --wait-timeout 180
            up_status=$?
            echo "cycle $attempt compose exit: $up_status"
            docker compose --file infra/compose/compose.yaml \
              --project-name "$LOCAL_STACK_TEST_PROJECT" down --volumes --remove-orphans >/dev/null 2>&1
            if [ "$up_status" -ne 0 ]; then
              echo "reproduced on cycle $attempt"
              exit "$up_status"
            fi
          done
          echo "all cycles green"
      - name: Run docker compose up with raw output
        if: always()
        run: |
          set -uo pipefail
          docker compose --file infra/compose/compose.yaml \
            --project-name "$LOCAL_STACK_TEST_PROJECT" \
            up --detach --remove-orphans --wait --wait-timeout 180
          up_status=$?
          echo "compose up exit status: $up_status"
          exit "$up_status"
      - name: Report service states and logs on failure
        if: always()
        run: |
          docker compose --file infra/compose/compose.yaml \
            --project-name "$LOCAL_STACK_TEST_PROJECT" ps --all || true
          for service in postgresql qdrant neo4j redis temporal temporal-ui temporal-cli postgres-provision temporal-schema-setup temporal-namespace-bootstrap; do
            echo "=== logs: $service ==="
            docker compose --file infra/compose/compose.yaml \
              --project-name "$LOCAL_STACK_TEST_PROJECT" logs --no-color --tail 40 "$service" 2>&1 | sed -E 's/(password|secret|key|token)=[^ ]*/\1=<redacted>/Ig' || true
          done
      - name: Tear down
        if: always()
        run: |
          docker compose --file infra/compose/compose.yaml \
            --project-name "$LOCAL_STACK_TEST_PROJECT" down --volumes --remove-orphans || true
