name: local service stack

on:
  pull_request:
    paths:
      - infra/**
      - tools/local_service_stack.py
      - tests/unit/tools/test_local_service_stack.py
      - tests/contract/test_local_service_stack_contract.py
      - tests/contract/test_ci_security.py
      - tests/contract/test_bootstrap_documentation.py
      - tests/integration/test_local_service_stack.py
      - pyproject.toml
      - uv.lock
      - pnpm-lock.yaml
      - .github/workflows/local-service-stack.yml
  push:
    branches: [master]
    paths:
      - infra/**
      - tools/local_service_stack.py
      - tests/unit/tools/test_local_service_stack.py
      - tests/contract/test_local_service_stack_contract.py
      - tests/contract/test_ci_security.py
      - tests/contract/test_bootstrap_documentation.py
      - tests/integration/test_local_service_stack.py
      - pyproject.toml
      - uv.lock
      - pnpm-lock.yaml
      - .github/workflows/local-service-stack.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-service-stack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-config:
    name: Ubuntu static configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.14.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install verified Docker Compose v2.30.0
        shell: bash
        run: |
          set -euo pipefail
          download_path="${RUNNER_TEMP}/docker-compose-linux-x86_64"
          curl --fail --location --silent --show-error \
            --output "$download_path" \
            https://github.com/docker/compose/releases/download/v2.30.0/docker-compose-linux-x86_64
          echo "1cddcb3399cc68c385796a6ab441ab5734d4c6a0cb4713bd2bf3f0d384550a38  $download_path" \
            | sha256sum --check --strict
          sudo install -D --mode 0755 \
            "$download_path" /usr/local/lib/docker/cli-plugins/docker-compose
          docker compose version --short | grep -Ex 'v?2\.30\.0'
      - name: Sync frozen Python workspace
        run: uv sync --all-packages --frozen
      - name: Run lifecycle and static security contracts
        run: >-
          uv run pytest tests/unit/tools/test_local_service_stack.py
          tests/contract/test_local_service_stack_contract.py
          tests/contract/test_ci_security.py -q
      - name: Validate default and overridden configuration
        shell: bash
        run: |
          set -euo pipefail
          git check-ignore --quiet .local
          rm -rf -- .local
          mkdir -p .local/test-results
          output_file=.local/test-results/ubuntu-config-output.log

          uv run poe stack-bootstrap >>"$output_file" 2>&1
          echo 'stack-bootstrap completed'
          uv run poe stack-config >>"$output_file" 2>&1
          echo 'default stack-config completed'
          POSTGRES_PORT=15432 \
          QDRANT_HTTP_PORT=16333 \
          QDRANT_GRPC_PORT=16334 \
          NEO4J_HTTP_PORT=17474 \
          NEO4J_BOLT_PORT=17687 \
          REDIS_PORT=16379 \
          TEMPORAL_GRPC_PORT=17233 \
          TEMPORAL_UI_PORT=18080 \
            uv run poe stack-config >>"$output_file" 2>&1
          echo 'overridden stack-config completed'

          set +e
          POSTGRES_PORT=malformed uv run poe stack-config >>"$output_file" 2>&1
          malformed_status=$?
          POSTGRES_PORT=15432 QDRANT_HTTP_PORT=15432 \
            uv run poe stack-config >>"$output_file" 2>&1
          duplicate_status=$?
          set -e
          test "$malformed_status" -eq 64
          test "$duplicate_status" -eq 64

          if grep --extended-regexp --ignore-case --quiet \
            'postgres_admin_password|postgres_application_password|postgres_temporal_password|qdrant_api_key|qdrant_config.yaml|neo4j_auth|redis_acl|redis_application_password|secret-value-that-must-not-leak|password=must-not-escape|must-not-be-forwarded|R2|cloudflare' \
            "$output_file"; then
            echo 'sanitized lifecycle output contained forbidden material' >&2
            exit 1
          fi

          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  windows-config:
    name: Windows static configuration
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.14.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install verified Docker Compose v2.30.0
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $downloadPath = Join-Path $env:RUNNER_TEMP "docker-compose-windows-x86_64.exe"
          Invoke-WebRequest `
            -Uri "https://github.com/docker/compose/releases/download/v2.30.0/docker-compose-windows-x86_64.exe" `
            -OutFile $downloadPath
          $expectedHash = "07ed10572bed0c42e5477bd33f9eb8f1b1c640d83120cc59feb7ce28f0c1bf86"
          $actualHash = (Get-FileHash -Algorithm SHA256 $downloadPath).Hash.ToLowerInvariant()
          if ($actualHash -cne $expectedHash) {
            throw "Docker Compose checksum mismatch"
          }
          $dockerConfig = Join-Path $env:RUNNER_TEMP "docker-config"
          $pluginDirectory = Join-Path $dockerConfig "cli-plugins"
          New-Item -ItemType Directory -Path $pluginDirectory -Force | Out-Null
          Copy-Item $downloadPath (Join-Path $pluginDirectory "docker-compose.exe") -Force
          $env:DOCKER_CONFIG = $dockerConfig
          Add-Content -Path $env:GITHUB_ENV -Value "DOCKER_CONFIG=$dockerConfig"
          $composeVersion = docker compose version --short
          if ($LASTEXITCODE -ne 0 -or $composeVersion -notin @("2.30.0", "v2.30.0")) {
            throw "Pinned Docker Compose was not selected"
          }
      - name: Sync frozen Python workspace
        run: uv sync --all-packages --frozen
      - name: Run lifecycle and static security contracts
        run: >-
          uv run pytest tests/unit/tools/test_local_service_stack.py
          tests/contract/test_local_service_stack_contract.py
          tests/contract/test_ci_security.py -q
      - name: Validate default and overridden configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          git check-ignore --quiet .local
          if ($LASTEXITCODE -ne 0) {
            throw ".local must remain an ignored local-state directory"
          }
          Remove-Item -LiteralPath ".local" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path ".local/test-results" -Force | Out-Null
          $outputFile = ".local/test-results/windows-config-output.log"

          uv run poe stack-bootstrap 2>&1 | Tee-Object -FilePath $outputFile -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run poe stack-config 2>&1 | Tee-Object -FilePath $outputFile -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $customPorts = @{
            POSTGRES_PORT = "15432"
            QDRANT_HTTP_PORT = "16333"
            QDRANT_GRPC_PORT = "16334"
            NEO4J_HTTP_PORT = "17474"
            NEO4J_BOLT_PORT = "17687"
            REDIS_PORT = "16379"
            TEMPORAL_GRPC_PORT = "17233"
            TEMPORAL_UI_PORT = "18080"
          }
          foreach ($entry in $customPorts.GetEnumerator()) {
            Set-Item -Path "Env:$($entry.Key)" -Value $entry.Value
          }
          uv run poe stack-config 2>&1 | Tee-Object -FilePath $outputFile -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($portName in $customPorts.Keys) { Remove-Item -Path "Env:$portName" }

          $env:POSTGRES_PORT = "malformed"
          uv run poe stack-config 2>&1 | Tee-Object -FilePath $outputFile -Append
          $malformedStatus = $LASTEXITCODE
          Remove-Item Env:POSTGRES_PORT

          $env:POSTGRES_PORT = "15432"
          $env:QDRANT_HTTP_PORT = "15432"
          uv run poe stack-config 2>&1 | Tee-Object -FilePath $outputFile -Append
          $duplicateStatus = $LASTEXITCODE
          Remove-Item Env:POSTGRES_PORT
          Remove-Item Env:QDRANT_HTTP_PORT
          if ($malformedStatus -ne 64 -or $duplicateStatus -ne 64) {
            throw "Malformed and duplicate port overrides must exit 64"
          }

          $forbiddenTokens = @(
            "postgres_admin_password",
            "postgres_application_password",
            "postgres_temporal_password",
            "qdrant_api_key",
            "qdrant_config.yaml",
            "neo4j_auth",
            "redis_acl",
            "redis_application_password",
            "secret-value-that-must-not-leak",
            "password=must-not-escape",
            "must-not-be-forwarded",
            "R2",
            "cloudflare"
          )
          $forbiddenPattern = ($forbiddenTokens | ForEach-Object { [regex]::Escape($_) }) -join "|"
          if (Select-String -Path $outputFile -Pattern $forbiddenPattern -Quiet) {
            throw "Sanitized lifecycle output contained forbidden material"
          }

          $changes = git status --porcelain=v1 --untracked-files=all
          if ($LASTEXITCODE -ne 0 -or $changes) {
            throw "Configuration validation modified the tracked working tree"
          }

  ubuntu-smoke:
    name: Ubuntu disposable full smoke
    needs: ubuntu-config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      LOCAL_STACK_TEST_PROJECT: knowledge-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.14.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install verified Docker Compose v2.30.0
        shell: bash
        run: |
          set -euo pipefail
          download_path="${RUNNER_TEMP}/docker-compose-linux-x86_64"
          curl --fail --location --silent --show-error \
            --output "$download_path" \
            https://github.com/docker/compose/releases/download/v2.30.0/docker-compose-linux-x86_64
          echo "1cddcb3399cc68c385796a6ab441ab5734d4c6a0cb4713bd2bf3f0d384550a38  $download_path" \
            | sha256sum --check --strict
          sudo install -D --mode 0755 \
            "$download_path" /usr/local/lib/docker/cli-plugins/docker-compose
          docker compose version --short | grep -Ex 'v?2\.30\.0'
      - name: Validate bounded project identity
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$LOCAL_STACK_TEST_PROJECT" =~ ^knowledge-ci-[0-9]+-[0-9]+$ ]]; then
            exit 1
          fi
          if (( ${#LOCAL_STACK_TEST_PROJECT} > 63 )); then
            exit 1
          fi
      - name: Sync frozen Python workspace
        run: uv sync --all-packages --frozen
      - name: Bootstrap and validate static configuration
        shell: bash
        run: |
          set -euo pipefail
          uv run python tools/local_service_stack.py bootstrap --project-name "$LOCAL_STACK_TEST_PROJECT"
          uv run python tools/local_service_stack.py config --project-name "$LOCAL_STACK_TEST_PROJECT"
      - name: Exercise persistence and recovery smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/test-results
          uv run pytest tests/integration/test_local_service_stack.py -m local_stack -q \
            --junitxml=.local/test-results/local-service-stack.xml
      - name: Reset exact project and assert cleanup
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          uv run python tools/local_service_stack.py reset \
            --project-name "$LOCAL_STACK_TEST_PROJECT" \
            --confirm-project "$LOCAL_STACK_TEST_PROJECT" \
            --non-interactive
          reset_status=$?

          project_filter="label=com.docker.compose.project=$LOCAL_STACK_TEST_PROJECT"
          inventory_status=0
          remaining_containers="$(docker container ls -a --filter "$project_filter" --format '{{.ID}}')" \
            || inventory_status=$?
          remaining_networks="$(docker network ls --filter "$project_filter" --format '{{.ID}}')" \
            || inventory_status=$?
          remaining_volumes="$(docker volume ls --filter "$project_filter" --format '{{.Name}}')" \
            || inventory_status=$?
          if (( reset_status != 0 || inventory_status != 0 )); then
            exit 1
          fi
          if [[ -n "$remaining_containers" || -n "$remaining_networks" || -n "$remaining_volumes" ]]; then
            exit 1
          fi
      - name: Upload sanitized JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: local-service-stack-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/test-results/local-service-stack.xml
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
