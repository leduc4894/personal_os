name: object storage live R2

# Trusted-surface-only live gate (design section 16.2): the dedicated R2 test
# bucket credentials must never be handed to fork code, so this workflow runs
# only on the protected master branch, on schedule and on manual dispatch. It
# never receives production bucket information or credentials, and it never
# performs a bucket listing or prefix deletion — cleanup happens inside the
# pytest fixtures and deletes only this run's recorded exact canonical keys.
on:
  push:
    branches: [master]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: object-storage-live-${{ github.workflow }}-${{ github.ref }}
  # A superseded run must retain its exact-key cleanup before another run uses
  # the same dedicated test bucket.
  cancel-in-progress: false

jobs:
  ubuntu-live:
    name: Ubuntu dedicated-bucket R2 contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Non-secret repository variables naming the dedicated TEST bucket only.
      R2_TEST_ENDPOINT: ${{ vars.R2_TEST_ENDPOINT }}
      R2_TEST_BUCKET_NAME: ${{ vars.R2_TEST_BUCKET_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.14.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync frozen Python workspace
        run: uv sync --all-packages --frozen
      - name: Write dedicated test credentials as mode-0600 secret files
        shell: bash
        env:
          # The runner context is step-level only, so the secret root path is
          # defined per step rather than in the job-level env block.
          R2_TEST_SECRET_ROOT: ${{ runner.temp }}/r2-live-secrets
          R2_TEST_ACCESS_KEY_ID: ${{ secrets.R2_TEST_ACCESS_KEY_ID }}
          R2_TEST_SECRET_ACCESS_KEY: ${{ secrets.R2_TEST_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$R2_TEST_SECRET_ROOT"
          umask 0177
          printf '%s' "$R2_TEST_ACCESS_KEY_ID" > "$R2_TEST_SECRET_ROOT/r2_test_access_key_id"
          printf '%s' "$R2_TEST_SECRET_ACCESS_KEY" > "$R2_TEST_SECRET_ROOT/r2_test_secret_access_key"
          chmod 0600 "$R2_TEST_SECRET_ROOT/r2_test_access_key_id" \
            "$R2_TEST_SECRET_ROOT/r2_test_secret_access_key"
          unset R2_TEST_ACCESS_KEY_ID R2_TEST_SECRET_ACCESS_KEY
          # Credential-shape guard: R2 access key ids are exactly 32 and secret
          # access keys exactly 64 characters. A wrapped or truncated paste in
          # the GitHub secret would otherwise surface later as a cryptic SigV4
          # header failure. Lengths only are ever rendered.
          for credential_shape in r2_test_access_key_id:32 r2_test_secret_access_key:64; do
            credential_file="${credential_shape%%:*}"
            expected_length="${credential_shape##*:}"
            actual_length=$(tr -d '\r\n' < "$R2_TEST_SECRET_ROOT/$credential_file" | wc -c)
            if [ "$actual_length" -ne "$expected_length" ]; then
              echo "::error::secret file $credential_file holds $actual_length credential characters, expected $expected_length; re-enter the GitHub secret as one clean line"
              exit 1
            fi
          done
      - name: Run live R2 contract cases with exact-key cleanup
        shell: bash
        env:
          R2_TEST_SECRET_ROOT: ${{ runner.temp }}/r2-live-secrets
        run: |
          set -uo pipefail
          mkdir -p .local/test-results
          raw_report=.local/test-results/object-storage-live-raw.xml
          sanitized_report=.local/test-results/object-storage-live.xml
          test_status=0
          sanitize_status=0
          uv run pytest tests/integration/r2_object_storage/test_live_r2_adapter.py \
            -m r2_live -q --tb=no --no-summary --junitxml="$raw_report" \
            || test_status=$?
          uv run python -m tests.integration.r2_object_storage.conftest \
            sanitize-junit --source "$raw_report" --destination "$sanitized_report" \
            || sanitize_status=$?
          rm -f -- "$raw_report"
          if (( sanitize_status != 0 )); then
            rm -f -- "$sanitized_report"
            exit "$sanitize_status"
          fi
          exit "$test_status"
      - name: Remove unsanitized JUnit staging file
        if: always()
        shell: bash
        run: rm -f -- .local/test-results/object-storage-live-raw.xml
      - name: Remove dedicated test secret files
        if: always()
        shell: bash
        env:
          R2_TEST_SECRET_ROOT: ${{ runner.temp }}/r2-live-secrets
        run: rm -rf -- "$R2_TEST_SECRET_ROOT"
      - name: Upload sanitized JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: object-storage-live-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/test-results/object-storage-live.xml
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
