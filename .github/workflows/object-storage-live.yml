name: object storage live R2

# Trusted-surface-only live gate (design section 16.2): the dedicated R2 test
# bucket credentials must never be handed to fork code, so this workflow runs
# only on the protected master branch, on schedule and on manual dispatch. It
# never receives production bucket information or credentials, and it never
# performs a bucket listing or prefix deletion — cleanup happens inside the
# pytest fixtures and deletes only this run's recorded exact canonical keys.
on:
  push:
    branches: [master]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: object-storage-live-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-live:
    name: Ubuntu dedicated-bucket R2 contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Non-secret repository variables naming the dedicated TEST bucket only.
      R2_TEST_ENDPOINT: ${{ vars.R2_TEST_ENDPOINT }}
      R2_TEST_BUCKET_NAME: ${{ vars.R2_TEST_BUCKET_NAME }}
      R2_TEST_SECRET_ROOT: ${{ runner.temp }}/r2-live-secrets
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.14.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync frozen Python workspace
        run: uv sync --all-packages --frozen
      - name: Write dedicated test credentials as mode-0600 secret files
        shell: bash
        env:
          R2_TEST_ACCESS_KEY_ID: ${{ secrets.R2_TEST_ACCESS_KEY_ID }}
          R2_TEST_SECRET_ACCESS_KEY: ${{ secrets.R2_TEST_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$R2_TEST_SECRET_ROOT"
          umask 0177
          printf '%s' "$R2_TEST_ACCESS_KEY_ID" > "$R2_TEST_SECRET_ROOT/r2_test_access_key_id"
          printf '%s' "$R2_TEST_SECRET_ACCESS_KEY" > "$R2_TEST_SECRET_ROOT/r2_test_secret_access_key"
          chmod 0600 "$R2_TEST_SECRET_ROOT/r2_test_access_key_id" \
            "$R2_TEST_SECRET_ROOT/r2_test_secret_access_key"
          unset R2_TEST_ACCESS_KEY_ID R2_TEST_SECRET_ACCESS_KEY
      - name: Run live R2 contract cases with exact-key cleanup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/test-results
          uv run pytest tests/integration/r2_object_storage/test_live_r2_adapter.py -m r2_live -q --junitxml=.local/test-results/object-storage-live.xml
      - name: Remove dedicated test secret files
        if: always()
        shell: bash
        run: rm -rf -- "$R2_TEST_SECRET_ROOT"
      - name: Upload sanitized JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: object-storage-live-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/test-results/object-storage-live.xml
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
