name: canonical core acceptance

# Protected trusted-surface-only live acceptance gate (design section 18.4):
# the phase-one canonical-core composition (disposable PostgreSQL 18.4 stack
# plus the dedicated private R2 test bucket) must never run fork code, so this
# workflow triggers only on protected master pushes, the daily schedule and
# manual dispatch — never on fork pull requests. It receives only the dedicated
# TEST bucket endpoint/name as repository variables and the two dedicated TEST
# credentials as secrets written step-locally as mode-0600 files under
# runner.temp; missing live credentials fail explicitly through the harness's
# fail-closed setup, never silently skip.
#
# Concurrency never cancels in progress: a superseded run keeps its exact-key
# cleanup and exact-label stack teardown, so no live-bucket object is ever
# orphaned mid-flight.
#
# Windows note (Task 14): this workflow runs a single ubuntu leg, so there is
# no parallel-leg bucket-sharing issue; every drill publishes per-run random
# content whose digest is unique per run, so per-run digests prevent
# intra-bucket collisions even between overlapping scheduled runs.
on:
  push:
    branches: [master]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-core-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ubuntu-live:
    name: Ubuntu phase-one acceptance live gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Non-secret repository variables naming the dedicated TEST bucket only.
      R2_TEST_ENDPOINT: ${{ vars.R2_TEST_ENDPOINT }}
      R2_TEST_BUCKET_NAME: ${{ vars.R2_TEST_BUCKET_NAME }}
      # Disposable per-run stack identity; never the operator project.
      CI: "true"
      LOCAL_STACK_TEST_PROJECT: knowledge-ci-${{ github.run_id }}-${{ github.run_attempt }}
      TEMPORAL_GRPC_PORT: "17243"
      TEMPORAL_UI_PORT: "18083"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.14.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync frozen Python workspace
        run: uv sync --all-packages --frozen
      - name: Install verified Docker Compose v2.30.0
        shell: bash
        run: |
          set -euo pipefail
          download_path="${RUNNER_TEMP}/docker-compose-linux-x86_64"
          curl --fail --location --silent --show-error \
            --output "$download_path" \
            https://github.com/docker/compose/releases/download/v2.30.0/docker-compose-linux-x86_64
          echo "1cddcb3399cc68c385796a6ab441ab5734d4c6a0cb4713bd2bf3f0d384550a38  $download_path" \
            | sha256sum --check --strict
          sudo install -D --mode 0755 \
            "$download_path" /usr/local/lib/docker/cli-plugins/docker-compose
          docker compose version --short | grep -Ex 'v?2\.30\.0'
      - name: Validate bounded project identity
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$LOCAL_STACK_TEST_PROJECT" =~ ^knowledge-ci-[0-9]+-[0-9]+$ ]]; then
            exit 1
          fi
          if (( ${#LOCAL_STACK_TEST_PROJECT} > 63 )); then
            exit 1
          fi
      - name: Compose live R2 environment as mode-0600 secret files
        shell: bash
        env:
          # The runner context is step-level only, so the secret root path is
          # defined per step rather than in the job-level env block.
          R2_TEST_SECRET_ROOT: ${{ runner.temp }}/r2-live-secrets
          R2_TEST_ACCESS_KEY_ID: ${{ secrets.R2_TEST_ACCESS_KEY_ID }}
          R2_TEST_SECRET_ACCESS_KEY: ${{ secrets.R2_TEST_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$R2_TEST_SECRET_ROOT"
          umask 0177
          printf '%s' "$R2_TEST_ACCESS_KEY_ID" > "$R2_TEST_SECRET_ROOT/r2_test_access_key_id"
          printf '%s' "$R2_TEST_SECRET_ACCESS_KEY" > "$R2_TEST_SECRET_ROOT/r2_test_secret_access_key"
          chmod 0600 "$R2_TEST_SECRET_ROOT/r2_test_access_key_id" \
            "$R2_TEST_SECRET_ROOT/r2_test_secret_access_key"
          unset R2_TEST_ACCESS_KEY_ID R2_TEST_SECRET_ACCESS_KEY
          # Credential-shape guard: R2 access key ids are exactly 32 and secret
          # access keys exactly 64 characters; a wrapped or truncated paste in
          # the GitHub secret would otherwise surface later as a cryptic SigV4
          # header failure. Lengths only are ever rendered, and any mismatch
          # fails the run explicitly instead of skipping the live gate.
          for credential_shape in r2_test_access_key_id:32 r2_test_secret_access_key:64; do
            credential_file="${credential_shape%%:*}"
            expected_length="${credential_shape##*:}"
            actual_length=$(tr -d '\r\n' < "$R2_TEST_SECRET_ROOT/$credential_file" | wc -c)
            if [ "$actual_length" -ne "$expected_length" ]; then
              echo "::error::secret file $credential_file holds $actual_length credential characters, expected $expected_length; re-enter the GitHub secret as one clean line"
              exit 1
            fi
          done
      - name: Run canonical-core acceptance live suite with exact-key cleanup
        shell: bash
        env:
          R2_TEST_SECRET_ROOT: ${{ runner.temp }}/r2-live-secrets
        run: |
          set -euo pipefail
          mkdir -p .local/test-results
          uv run pytest tests/integration/canonical_core -m "local_stack and r2_live" -q --junitxml=.local/test-results/canonical-core-acceptance.xml
      - name: Remove dedicated test secret files
        if: always()
        shell: bash
        env:
          R2_TEST_SECRET_ROOT: ${{ runner.temp }}/r2-live-secrets
        run: rm -rf -- "$R2_TEST_SECRET_ROOT"
      - name: Reset exact project and assert cleanup
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          uv run python tools/local_service_stack.py reset \
            --project-name "$LOCAL_STACK_TEST_PROJECT" \
            --confirm-project "$LOCAL_STACK_TEST_PROJECT" \
            --non-interactive
          reset_status=$?

          project_filter="label=com.docker.compose.project=$LOCAL_STACK_TEST_PROJECT"
          inventory_status=0
          remaining_containers="$(docker container ls -a --filter "$project_filter" --format '{{.ID}}')" \
            || inventory_status=$?
          remaining_networks="$(docker network ls --filter "$project_filter" --format '{{.ID}}')" \
            || inventory_status=$?
          remaining_volumes="$(docker volume ls --filter "$project_filter" --format '{{.Name}}')" \
            || inventory_status=$?
          if (( reset_status != 0 || inventory_status != 0 )); then
            exit 1
          fi
          if [[ -n "$remaining_containers" || -n "$remaining_networks" || -n "$remaining_volumes" ]]; then
            exit 1
          fi
      - name: Upload sanitized JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canonical-core-acceptance-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/test-results/canonical-core-acceptance.xml
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
