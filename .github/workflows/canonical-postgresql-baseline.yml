name: canonical PostgreSQL baseline

on:
  pull_request:
    paths:
      - migrations/**
      - alembic.ini
      - docs/superpowers/specs/canonical-postgresql-baseline-design.md
      - apps/worker/src/workflow_worker/**
      - apps/worker/pyproject.toml
      - tests/unit/workflow_worker/**
      - tests/unit/migrations/test_database_migration_runtime.py
      - tests/contract/test_canonical_postgresql_migration_contract.py
      - tests/contract/test_ci_security.py
      - tests/integration/test_canonical_postgresql_baseline.py
      - tests/integration/projection_dispatch/**
      - src/personal_os/sources/**
      - packages/postgresql-source-store/src/**
      - pyproject.toml
      - uv.lock
      - infra/compose/compose.yaml
      - infra/compose/scripts/postgres-provision.sh
      - infra/compose/images.lock.yaml
      - .github/workflows/canonical-postgresql-baseline.yml
  push:
    branches: [master]
    paths:
      - migrations/**
      - alembic.ini
      - docs/superpowers/specs/canonical-postgresql-baseline-design.md
      - apps/worker/src/workflow_worker/**
      - apps/worker/pyproject.toml
      - tests/unit/workflow_worker/**
      - tests/unit/migrations/test_database_migration_runtime.py
      - tests/contract/test_canonical_postgresql_migration_contract.py
      - tests/contract/test_ci_security.py
      - tests/integration/test_canonical_postgresql_baseline.py
      - tests/integration/projection_dispatch/**
      - src/personal_os/sources/**
      - packages/postgresql-source-store/src/**
      - pyproject.toml
      - uv.lock
      - infra/compose/compose.yaml
      - infra/compose/scripts/postgres-provision.sh
      - infra/compose/images.lock.yaml
      - .github/workflows/canonical-postgresql-baseline.yml
  schedule:
    - cron: "31 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-postgresql-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-static:
    name: Windows static migration assurance
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.14.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync frozen Python workspace
        run: uv sync --all-packages --frozen
      - name: Verify single Alembic head offline
        run: uv run alembic heads
      - name: Run static migration contracts
        run: uv run pytest tests/unit/migrations/test_database_migration_runtime.py tests/contract/test_canonical_postgresql_migration_contract.py tests/contract/test_ci_security.py -q
      - name: Lint migration sources
        run: uv run ruff check migrations tests/unit/migrations tests/contract/test_canonical_postgresql_migration_contract.py
      - name: Type-check migration sources
        run: uv run mypy migrations

  ubuntu-lifecycle:
    name: Ubuntu PostgreSQL 18.4 lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      LOCAL_STACK_TEST_PROJECT: knowledge-ci-${{ github.run_id }}-${{ github.run_attempt }}
      TEMPORAL_GRPC_PORT: "17243"
      TEMPORAL_UI_PORT: "18083"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.14.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install verified Docker Compose v2.30.0
        shell: bash
        run: |
          set -euo pipefail
          download_path="${RUNNER_TEMP}/docker-compose-linux-x86_64"
          curl --fail --location --silent --show-error \
            --output "$download_path" \
            https://github.com/docker/compose/releases/download/v2.30.0/docker-compose-linux-x86_64
          echo "1cddcb3399cc68c385796a6ab441ab5734d4c6a0cb4713bd2bf3f0d384550a38  $download_path" \
            | sha256sum --check --strict
          sudo install -D --mode 0755 \
            "$download_path" /usr/local/lib/docker/cli-plugins/docker-compose
          docker compose version --short | grep -Ex 'v?2\.30\.0'
      - name: Validate bounded project identity
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$LOCAL_STACK_TEST_PROJECT" =~ ^knowledge-ci-[0-9]+-[0-9]+$ ]]; then
            exit 1
          fi
          if (( ${#LOCAL_STACK_TEST_PROJECT} > 63 )); then
            exit 1
          fi
      - name: Sync frozen Python workspace
        run: uv sync --all-packages --frozen
      - name: Exercise PostgreSQL 18.4 baseline lifecycle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/test-results
          uv run pytest tests/integration/test_canonical_postgresql_baseline.py -m local_stack -q \
            tests/integration/projection_dispatch \
            --junitxml=.local/test-results/canonical-postgresql-baseline.xml
      - name: Reset exact project and assert cleanup
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          uv run python tools/local_service_stack.py reset \
            --project-name "$LOCAL_STACK_TEST_PROJECT" \
            --confirm-project "$LOCAL_STACK_TEST_PROJECT" \
            --non-interactive
          reset_status=$?

          project_filter="label=com.docker.compose.project=$LOCAL_STACK_TEST_PROJECT"
          inventory_status=0
          remaining_containers="$(docker container ls -a --filter "$project_filter" --format '{{.ID}}')" \
            || inventory_status=$?
          remaining_networks="$(docker network ls --filter "$project_filter" --format '{{.ID}}')" \
            || inventory_status=$?
          remaining_volumes="$(docker volume ls --filter "$project_filter" --format '{{.Name}}')" \
            || inventory_status=$?
          if (( reset_status != 0 || inventory_status != 0 )); then
            exit 1
          fi
          if [[ -n "$remaining_containers" || -n "$remaining_networks" || -n "$remaining_volumes" ]]; then
            exit 1
          fi
      - name: Upload sanitized JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canonical-postgresql-baseline-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/test-results/canonical-postgresql-baseline.xml
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
