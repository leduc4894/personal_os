name: quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu quality
            operating-system: ubuntu-latest
          - name: Windows portability
            operating-system: windows-latest
    runs-on: ${{ matrix.operating-system }}
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.14.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Setup pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: "10.34.0"
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Verify pinned toolchain
        # Run via `uv run` so the checker executes under — and its `python
        # --version` subprocess resolves to — the uv-managed CPython 3.14.6,
        # not the runner's default Python (3.12.x) which setup-uv does not
        # place on PATH as bare `python`.
        run: uv run python tools/check_toolchain_versions.py
      - name: Sync frozen Python workspace
        run: uv sync --all-packages --frozen
      - name: Install frozen npm workspace
        run: pnpm install --frozen-lockfile
      - name: Run quality gates
        run: uv run --all-packages --frozen poe verify
      - name: Verify lockfiles unchanged
        run: git diff --exit-code -- uv.lock pnpm-lock.yaml
