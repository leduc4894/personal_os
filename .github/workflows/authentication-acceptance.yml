name: authentication acceptance

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: authentication-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authentication-test:
    name: Authentication acceptance stack
    runs-on: ubuntu-latest
    # The disposable-stack integration modules of tests/integration/
    # authentication run behind the local_stack marker on a real PostgreSQL
    # 18.4 compose project, and the contract leak gate builds the real Web
    # and plugin production bundles through pnpm. The quality workflow
    # itself stays free of stack references by the CI security contract.
    timeout-minutes: 45
    env:
      CI: "true"
      LOCAL_STACK_TEST_PROJECT: knowledge-ci-${{ github.run_id }}-${{ github.run_attempt }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.14.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Setup pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: "10.34.0"
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install verified Docker Compose v2.30.0
        shell: bash
        run: |
          set -euo pipefail
          download_path="${RUNNER_TEMP}/docker-compose-linux-x86_64"
          curl --fail --location --silent --show-error \
            --output "$download_path" \
            https://github.com/docker/compose/releases/download/v2.30.0/docker-compose-linux-x86_64
          echo "1cddcb3399cc68c385796a6ab441ab5734d4c6a0cb4713bd2bf3f0d384550a38  $download_path" \
            | sha256sum --check --strict
          sudo install -D --mode 0755 \
            "$download_path" /usr/local/lib/docker/cli-plugins/docker-compose
          docker compose version --short | grep -Ex 'v?2\.30\.0'
      - name: Validate bounded project identity
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$LOCAL_STACK_TEST_PROJECT" =~ ^knowledge-ci-[0-9]+-[0-9]+$ ]]; then
            exit 1
          fi
          if (( ${#LOCAL_STACK_TEST_PROJECT} > 63 )); then
            exit 1
          fi
      - name: Sync frozen Python workspace
        run: uv sync --all-packages --frozen
      - name: Install frozen npm workspace
        run: pnpm install --frozen-lockfile
      - name: Prefetch pinned stack images
        shell: bash
        run: |
          set -euo pipefail
          docker compose --file infra/compose/compose.yaml \
            --project-name "$LOCAL_STACK_TEST_PROJECT" pull --quiet
      - name: Run authentication acceptance gate
        run: uv run --all-packages --frozen poe authentication-test
      - name: Reset exact project and assert cleanup
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          uv run python tools/local_service_stack.py reset \
            --project-name "$LOCAL_STACK_TEST_PROJECT" \
            --confirm-project "$LOCAL_STACK_TEST_PROJECT" \
            --non-interactive
          reset_status=$?

          project_filter="label=com.docker.compose.project=$LOCAL_STACK_TEST_PROJECT"
          inventory_status=0
          remaining_containers="$(docker container ls -a --filter "$project_filter" --format '{{.ID}}')" \
            || inventory_status=$?
          remaining_networks="$(docker network ls --filter "$project_filter" --format '{{.ID}}')" \
            || inventory_status=$?
          remaining_volumes="$(docker volume ls --filter "$project_filter" --format '{{.Name}}')" \
            || inventory_status=$?
          if (( reset_status != 0 || inventory_status != 0 )); then
            exit 1
          fi
          if [[ -n "$remaining_containers" || -n "$remaining_networks" || -n "$remaining_volumes" ]]; then
            exit 1
          fi
