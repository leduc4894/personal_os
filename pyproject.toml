[project]
name = "knowledge-core"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic==1.18.5",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "psycopg[binary]==3.3.4",
  "SQLAlchemy==2.0.51",
]

[build-system]
requires = ["uv_build==0.11.32"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "import-linter==2.13",
  "mypy==2.3.0",
  "poethepoet==0.48.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "pyyaml==6.0.3",
  "ruff==0.15.22",
]

[tool.uv]
required-version = "==0.11.32"

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/mcp",
    "apps/worker",
    "packages/r2-object-storage",
    "packages/postgresql-source-store",
]

[tool.uv.sources]
knowledge-core = { workspace = true }
postgresql-source-store = { workspace = true }

[tool.uv.build-backend]
module-name = "personal_os"

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
  "-m",
  "not local_stack and not r2_live",
]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "local_stack: requires a reachable Linux Docker Engine and may create disposable containers and volumes",
  "r2_live: requires dedicated live Cloudflare R2 test credentials and a dedicated private test bucket; fails (never skips) without them",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = [
    "src",
    "apps",
    "packages/r2-object-storage/src",
    "packages/postgresql-source-store/src",
    "migrations",
    "tests",
    "tools",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
mypy_path = [
    "src",
    "apps/api/src",
    "apps/mcp/src",
    "apps/worker/src",
    "packages/r2-object-storage/src",
    "packages/postgresql-source-store/src",
]
exclude = ["^tests[/\\\\]fixtures[/\\\\]"]
files = [
    "src",
    "apps/api/src",
    "apps/mcp/src",
    "apps/worker/src",
    "packages/r2-object-storage/src",
    "packages/postgresql-source-store/src",
    "migrations",
    "tools",
]

[tool.coverage.run]
branch = true
source = [
    "personal_os",
    "api_runtime",
    "mcp_runtime",
    "workflow_worker",
    "r2_object_storage",
    "postgresql_source_store",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

# --- Poe command graph -------------------------------------------------------
# Private leaf tasks (one tool invocation each) compose into the eight public
# gates that `uv run poe verify` runs in order: format-check, lint, type-check,
# boundary-check, test, build. Coverage is diagnostic only (no fail_under).

[tool.poe.tasks.python-format]
cmd = "ruff format src apps packages/r2-object-storage/src packages/postgresql-source-store/src tests tools"

[tool.poe.tasks.python-format-check]
cmd = "ruff format --check src apps packages/r2-object-storage/src packages/postgresql-source-store/src tests tools"

[tool.poe.tasks.python-lint]
cmd = "ruff check src apps packages/r2-object-storage/src packages/postgresql-source-store/src tests tools"

# TypeScript subtasks run through Poe's shell task type so the ``pnpm`` program
# resolves on every platform. On Windows CI, pnpm/action-setup installs pnpm as
# a ``pnpm.cmd`` shim that Poe cannot spawn directly via CreateProcess (the
# shell is required to resolve the .cmd extension); on Unix the shell finds the
# pnpm executable just the same.
[tool.poe.tasks.typescript-format]
shell = "pnpm run format"

[tool.poe.tasks.typescript-format-check]
shell = "pnpm run format:check"

[tool.poe.tasks.typescript-lint]
shell = "pnpm run lint"

[tool.poe.tasks.python-type-check]
cmd = "mypy src apps/api/src apps/mcp/src apps/worker/src packages/r2-object-storage/src packages/postgresql-source-store/src tools"

[tool.poe.tasks.typescript-type-check]
shell = "pnpm run type-check"

[tool.poe.tasks.python-test]
cmd = "pytest --cov --cov-report=term-missing"

[tool.poe.tasks.typescript-test]
shell = "pnpm run test"

[tool.poe.tasks.import-boundaries]
cmd = "lint-imports"

[tool.poe.tasks.boundary-contract-tests]
cmd = "pytest tests/contract/test_architecture_boundaries.py -q"

# API contract artifact gates: export rewrites the snapshot, the snapshot check
# compares the committed bytes without rewriting, the client check proves the
# generated TypeScript still matches the committed schema document, and the
# composite runs both checks as one boundary gate.
[tool.poe.tasks.api-contract-export]
cmd = "uv run --package api-runtime personal-api export-openapi --output packages/api-client/openapi.json"

[tool.poe.tasks.api-contract-snapshot-check]
cmd = "uv run python tools/api_contract_artifacts.py check"

[tool.poe.tasks.api-client-generate-check]
shell = "pnpm --filter @workspace/api-client run generate:check"

[tool.poe.tasks.api-contract-check]
sequence = ["api-contract-snapshot-check", "api-client-generate-check"]
default_item_type = "ref"

# Canonical-core acceptance and recovery feature gate: the unit directories of
# the composed domain services, adapters, runtime configuration and the
# repository-internal operations CLI.
[tool.poe.tasks.canonical-core-test]
cmd = "pytest tests/unit/runtime_configuration tests/unit/identity tests/unit/sources tests/unit/recovery tests/unit/postgresql_source_store tests/unit/tools -q"

# Authentication acceptance feature gate (web-auth plan, Task 15): the
# authentication unit, api-runtime unit, adapter unit and HTTP contract
# suites plus the disposable-stack integration suite. The marker override
# enables ``local_stack`` — fail, never skip: the integration conftest
# refuses to run without ``CI=true`` and a unique ``knowledge-ci-*``
# project name, and the contract leak gate requires pnpm for the real
# Web/plugin production builds.
[tool.poe.tasks.authentication-test]
cmd = "pytest tests/unit/authentication tests/unit/api_runtime tests/unit/postgresql_source_store tests/contract/api tests/integration/authentication -m \"not r2_live\" -q"

# Authentication browser acceptance gate (web-auth plan, Task 15): the
# Playwright journeys of tests/end_to_end/authentication against the built
# Web application (the Playwright webServer performs the build itself).
# Browser binaries must be installed beforehand; Playwright fails rather
# than skipping when they are absent.
[tool.poe.tasks.authentication-e2e]
shell = "pnpm run test:e2e:authentication"

[tool.poe.tasks.python-build]
cmd = "uv build --all-packages --clear"

[tool.poe.tasks.stack-bootstrap]
cmd = "uv run python tools/local_service_stack.py bootstrap"

[tool.poe.tasks.stack-config]
cmd = "uv run python tools/local_service_stack.py config"

[tool.poe.tasks.stack-up]
cmd = "uv run python tools/local_service_stack.py up"

[tool.poe.tasks.stack-status]
cmd = "uv run python tools/local_service_stack.py status"

[tool.poe.tasks.stack-verify]
cmd = "uv run python tools/local_service_stack.py verify"

[tool.poe.tasks.stack-down]
cmd = "uv run python tools/local_service_stack.py down"

[tool.poe.tasks.stack-reset]
cmd = "uv run python tools/local_service_stack.py reset"

[tool.poe.tasks.stack-smoke]
cmd = "uv run python tools/local_service_stack.py smoke"

# One-shot read-only R2 HeadBucket diagnostic. This is the only command that
# contacts R2; startup validation, liveness and normal readiness stay offline.
[tool.poe.tasks.object-storage-check-runtime]
cmd = "uv run --package r2-object-storage object-storage-check-runtime --service worker"

# Dedicated live R2 gate (design section 16.2): explicit invocation only. The
# explicit ``-m r2_live`` overrides the default marker expression, and the
# harness fixtures fail (never skip) without dedicated test credentials.
[tool.poe.tasks.object-storage-test-live]
cmd = "pytest tests/integration/r2_object_storage/test_live_r2_adapter.py -m r2_live -q"

[tool.poe.tasks.database-heads]
cmd = "alembic heads"

[tool.poe.tasks.database-current]
cmd = "alembic current --check-heads"

[tool.poe.tasks.database-upgrade]
cmd = "alembic upgrade head"

[tool.poe.tasks.database-downgrade]
cmd = "alembic -x allow_destructive=true downgrade base"

[tool.poe.tasks.typescript-build]
shell = "pnpm run build"
env = { NEXT_TELEMETRY_DISABLED = "1" }

[tool.poe.tasks.format]
sequence = ["python-format", "typescript-format"]
default_item_type = "ref"

[tool.poe.tasks.format-check]
sequence = ["python-format-check", "typescript-format-check"]
default_item_type = "ref"

[tool.poe.tasks.lint]
sequence = ["python-lint", "typescript-lint"]
default_item_type = "ref"

[tool.poe.tasks.type-check]
sequence = ["python-type-check", "typescript-type-check"]
default_item_type = "ref"

[tool.poe.tasks.test]
sequence = ["python-test", "typescript-test"]
default_item_type = "ref"

[tool.poe.tasks.boundary-check]
sequence = ["import-boundaries", "boundary-contract-tests", "api-contract-check"]
default_item_type = "ref"

[tool.poe.tasks.build]
sequence = ["python-build", "typescript-build"]
default_item_type = "ref"

[tool.poe.tasks.verify]
sequence = ["format-check", "lint", "type-check", "boundary-check", "test", "build"]
default_item_type = "ref"
