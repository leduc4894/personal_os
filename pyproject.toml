[project]
name = "knowledge-core"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = []

[build-system]
requires = ["uv_build==0.11.32"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "import-linter==2.13",
  "mypy==2.3.0",
  "poethepoet==0.48.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.15.22",
]

[tool.uv]
required-version = "==0.11.32"

[tool.uv.build-backend]
module-name = "personal_os"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "apps", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "apps/api/src", "apps/mcp/src", "apps/worker/src", "tools"]

[tool.coverage.run]
branch = true
source = ["personal_os", "api_runtime", "mcp_runtime", "workflow_worker"]

[tool.coverage.report]
show_missing = true
skip_covered = false
